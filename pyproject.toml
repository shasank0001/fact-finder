[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "factfinder"
version = "0.1.0"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools]
py-modules = ["api"]

[tool.setuptools.packages.find]
include = ["factfinder*", "micro-services*"]
namespaces = true

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.pytest.ini_options]
testpaths = ["tests", "micro-services/ecom_det_fin/tests"]
pythonpath = [".", "micro-services/ecom_det_fin"]
