name: Verify
on: [push, pull_request]
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -c constraints.txt -e .
      - run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: fact-sniff-detect-main/package-lock.json
      - run: npm ci && npm run build && npm run typecheck && npm run lint
        working-directory: fact-sniff-detect-main
